<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2a8f">
<title>초성 성경 카드</title>
<style>
:root{
  --sky1:#3b2a8f;--sky2:#6a3fd1;--sky3:#ff7eb6;
  --card:#fffaf0;--ink:#2b2350;--muted:#7a6fa8;
  --gold:#ffd54a;--gold-d:#e0a400;--mint:#3fd6a0;--mint-d:#1fa577;
  --red:#ff6b6b;--red-d:#d84646;--blue:#4cc3ff;--blue-d:#1f93cf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 20% 10%,#ffffff22 0 2px,transparent 3px) 0 0/60px 60px,
             radial-gradient(circle at 70% 60%,#ffffff1a 0 1.5px,transparent 2.5px) 0 0/90px 90px,
             linear-gradient(170deg,var(--sky1),var(--sky2) 55%,var(--sky3));
  background-attachment:fixed;
  min-height:100vh;overflow-x:hidden;
}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}
.app{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}

/* 공통 버튼 */
.btn{display:block;width:100%;border-radius:20px;padding:17px 14px;font-weight:900;font-size:20px;transition:transform .08s}
.btn:active{transform:translateY(4px)}
.btn-gold{background:var(--gold);color:#5a3d00;box-shadow:0 6px 0 var(--gold-d)}
.btn-gold:active{box-shadow:0 2px 0 var(--gold-d)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d)}
.btn-blue:active{box-shadow:0 2px 0 var(--blue-d)}
.btn-ghost{background:#ffffff26;color:#fff;font-size:16px;padding:13px;box-shadow:none}
.btn:disabled{opacity:.45;transform:none}
.pill{background:#ffffff2b;color:#fff;border-radius:999px;padding:8px 13px;font-weight:800;font-size:15px}

/* 홈 */
.top{display:flex;justify-content:space-between;align-items:center}
.hero{text-align:center;color:#fff;padding:22px 0 14px}
.hero .logo{font-size:56px;line-height:1;filter:drop-shadow(0 4px 0 #0003);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hero h1{font-size:34px;margin:10px 0 4px;letter-spacing:-1px;text-shadow:0 3px 0 #0003}
.hero p{margin:0;font-weight:700;opacity:.85}
.levelbox{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 0 #0002;margin-bottom:16px}
.lvrow{display:flex;align-items:center;gap:12px}
.lvbadge{width:58px;height:58px;border-radius:18px;background:linear-gradient(var(--gold),#ffb300);display:grid;place-items:center;font-weight:1000;color:#5a3d00;box-shadow:0 4px 0 var(--gold-d);flex:none;text-align:center;line-height:1.05}
.lvbadge small{display:block;font-size:11px}
.lvbadge b{font-size:22px}
.lvinfo{flex:1}
.lvname{font-weight:900;font-size:17px}
.xpbar{height:14px;background:#ece6ff;border-radius:99px;overflow:hidden;margin-top:7px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#7ef0c4);border-radius:99px;transition:width .6s}
.xptext{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.chip{background:#f3efff;border-radius:14px;padding:9px 4px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.chip b{display:block;font-size:20px;color:var(--ink)}
.howto{display:flex;justify-content:space-between;gap:6px;color:#fff;font-weight:800;font-size:13px;text-align:center;margin:4px 0 16px}
.howto div{flex:1;background:#ffffff1f;border-radius:14px;padding:10px 4px}
.howto span{display:block;font-size:24px;margin-bottom:3px}
.stack{display:grid;gap:14px}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:99px;padding:1px 9px;font-size:15px;margin-left:6px;vertical-align:2px}

/* 게임 */
.gamehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scorebox{display:flex;gap:6px}
.progress{height:12px;background:#ffffff2b;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.progress i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .3s}
.counter{color:#fff;text-align:center;font-weight:800;font-size:14px;opacity:.9}
.combo{height:30px;text-align:center;color:var(--gold);font-weight:1000;font-size:22px;text-shadow:0 2px 0 #0004}
.combo.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

.scene{perspective:1100px;margin:6px 0 16px}
.flip{position:relative;width:100%;height:410px;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:var(--card);box-shadow:0 10px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,#fffdf4,#fff1c7)}
.tag{font-size:13px;font-weight:900;color:var(--muted);background:#f0ebff;border-radius:99px;padding:5px 12px}
.initials{font-size:clamp(44px,15vw,72px);font-weight:1000;letter-spacing:6px;margin:14px 0 6px;color:var(--sky1);line-height:1.1;padding-left:6px;white-space:nowrap}
.write{font-weight:800;color:var(--muted);font-size:15px}
.same{margin-top:10px;font-size:13px;font-weight:800;color:#c2410c;background:#ffedd5;border-radius:12px;padding:6px 10px}
.hintbox{margin-top:12px;width:100%;display:grid;gap:7px}
.hint{background:#e9fbf3;color:#11684a;border-radius:14px;padding:10px 12px;font-weight:800;font-size:16px;animation:pop .3s}
.answer{font-size:clamp(42px,13vw,58px);font-weight:1000;color:var(--ink);margin:14px 0 6px;letter-spacing:2px}
.order{font-weight:800;color:var(--muted)}
.check{font-weight:900;font-size:17px;margin-top:16px}

.controls{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-ok{background:var(--mint);color:#fff;box-shadow:0 6px 0 var(--mint-d);font-size:22px}
.btn-ok:active{box-shadow:0 2px 0 var(--mint-d)}
.btn-no{background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red-d);font-size:22px}
.btn-no:active{box-shadow:0 2px 0 var(--red-d)}

.floater{position:fixed;left:50%;top:42%;transform:translate(-50%,0);font-size:38px;font-weight:1000;color:var(--gold);text-shadow:0 3px 0 #0005;pointer-events:none;animation:float 0.9s ease-out forwards;z-index:9}
.floater.miss{color:#fff}
@keyframes float{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-90px) scale(1.2)}}

/* 결과 */
.result{background:var(--card);border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 10px 0 #0003}
.stars{font-size:52px;letter-spacing:4px;margin:4px 0}
.stars span{display:inline-block;opacity:.18;filter:grayscale(1)}
.stars span.lit{opacity:1;filter:none;animation:pop .5s backwards}
.result h2{margin:6px 0 2px;font-size:28px}
.newrec{display:inline-block;background:var(--red);color:#fff;font-weight:900;border-radius:99px;padding:4px 12px;font-size:13px;margin-top:6px;animation:pop .5s}
.rgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
.wrongs{text-align:left;background:#fff1f1;border-radius:18px;padding:12px;margin-bottom:6px}
.wrongs b{display:block;margin-bottom:8px;color:var(--red-d)}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wlist span{background:#fff;border-radius:10px;padding:6px 9px;font-weight:800;font-size:14px;box-shadow:0 2px 0 #0001}
.wlist small{color:var(--muted);margin-right:4px}

/* 모달 */
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--card);border-radius:24px;padding:22px;max-width:340px;width:100%;text-align:center}
.modal h3{margin:0 0 6px;font-size:22px}
.modal p{margin:0 0 16px;color:var(--muted);font-weight:700}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .btn{font-size:17px}
.btn-plain{background:#ece6ff;color:var(--ink);box-shadow:0 5px 0 #cfc4f5}

.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">

<!-- 홈 -->
<section id="home">
  <div class="top">
    <span class="pill">📖 창세기 ~ 아가 22권</span>
    <button class="pill" id="soundBtn">🔊 소리</button>
  </div>
  <header class="hero">
    <div class="logo">🃏</div>
    <h1>초성 성경 카드</h1>
    <p>초성만 보고 성경 이름을 맞혀 봐!</p>
  </header>

  <div class="levelbox">
    <div class="lvrow">
      <div class="lvbadge"><div><small>LEVEL</small><b id="lvNum">1</b></div></div>
      <div class="lvinfo">
        <div class="lvname" id="lvName">새싹 탐험가 🌱</div>
        <div class="xpbar"><i id="xpFill"></i></div>
        <div class="xptext" id="xpText">0 / 100 XP</div>
      </div>
    </div>
    <div class="chips">
      <div class="chip">최고 점수<b id="bestScore">0</b></div>
      <div class="chip">최고 콤보<b id="bestCombo">0</b></div>
      <div class="chip">도전 횟수<b id="plays">0</b></div>
    </div>
  </div>

  <div class="howto">
    <div><span>👀</span>초성 보기</div>
    <div><span>✏️</span>종이에 쓰기</div>
    <div><span>🔄</span>뒤집어 확인</div>
  </div>

  <div class="stack">
    <button class="btn btn-gold" id="startBtn">🚀 22권 카드 도전!</button>
    <button class="btn btn-blue" id="retryHomeBtn">🔁 틀린 카드 다시 풀기<span class="badge" id="wrongCount">0</span></button>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="hidden">
  <div class="gamehead">
    <button class="pill" id="quitBtn">✕ 그만</button>
    <div class="scorebox">
      <span class="pill" id="modeTag">⭐ <b id="score">0</b>점</span>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="counter" id="counter">1 / 22</div>
  <div class="combo" id="combo"></div>

  <div class="scene">
    <div class="flip" id="card">
      <div class="face front">
        <span class="tag" id="cardTag">초성 카드</span>
        <div class="initials" id="initials"></div>
        <div class="write">✏️ 종이에 써 보고 카드를 뒤집어!</div>
        <div class="same hidden" id="sameFront"></div>
        <div class="hintbox" id="hintBox"></div>
      </div>
      <div class="face back">
        <span class="tag">정답</span>
        <div class="answer" id="answer"></div>
        <div class="order" id="order"></div>
        <div class="same hidden" id="sameBack"></div>
        <div class="check">내가 쓴 답이 맞았나요?</div>
      </div>
    </div>
  </div>

  <div class="controls" id="frontControls">
    <button class="btn btn-blue" id="hintBtn">💡 힌트</button>
    <button class="btn btn-gold" id="flipBtn">🔄 뒤집기</button>
  </div>
  <div class="judge hidden" id="judgeControls">
    <button class="btn btn-no" id="noBtn">❌ 틀렸어</button>
    <button class="btn btn-ok" id="okBtn">⭕ 맞았어</button>
  </div>
</section>

<!-- 결과 -->
<section id="end" class="hidden">
  <header class="hero" style="padding-top:28px">
    <div class="logo" id="endEmoji">🏆</div>
  </header>
  <div class="result">
    <div class="stars" id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <h2 id="endTitle">도전 완료!</h2>
    <div id="endSub" style="font-weight:700;color:var(--muted)"></div>
    <div id="newRec" class="newrec hidden">🎉 최고 기록!</div>
    <div class="rgrid">
      <div class="chip">점수<b id="rScore">0</b></div>
      <div class="chip">맞힌 카드<b id="rRight">0</b></div>
      <div class="chip">최고 콤보<b id="rCombo">0</b></div>
    </div>
    <div class="wrongs hidden" id="wrongBox">
      <b>📝 다시 볼 카드</b>
      <div class="wlist" id="wrongList"></div>
    </div>
    <div class="stack" style="margin-top:14px">
      <button class="btn btn-blue" id="retryEndBtn">🔁 틀린 카드 다시 풀기</button>
      <button class="btn btn-gold" id="againBtn">🚀 22권 다시 도전</button>
      <button class="btn btn-plain" id="homeBtn">🏠 처음 화면</button>
    </div>
  </div>
</section>

</main>

<div class="modal hidden" id="quitModal">
  <div class="box">
    <h3>그만할까요?</h3>
    <p>지금까지 푼 기록은 사라져요.</p>
    <div class="row">
      <button class="btn btn-plain" id="stayBtn">계속하기</button>
      <button class="btn btn-no" id="leaveBtn" style="font-size:17px">그만하기</button>
    </div>
  </div>
</div>

<script>
/* ---------- 데이터: 창세기 ~ 아가 22권 ---------- */
const BOOKS = [
  ["창세기",  ["하나님이 엿새 동안 세상을 만드셨어요", "노아의 방주와 무지개 약속"]],
  ["출애굽기",["모세가 지팡이를 들자 바다가 갈라졌어요", "이집트를 탈출하고 십계명을 받았어요"]],
  ["레위기",  ["제사장들이 제사 드리는 방법", "\"너희는 거룩하라\""]],
  ["민수기",  ["광야에서 이스라엘 백성의 숫자를 세었어요", "장대에 매단 놋뱀을 보면 살았어요"]],
  ["신명기",  ["가나안에 들어가기 전, 모세의 마지막 설교", "모세가 느보산에서 약속의 땅을 바라봤어요"]],
  ["여호수아",["나팔 소리에 여리고 성이 무너졌어요", "모세 다음 지도자의 이름이 책 제목!"]],
  ["사사기",  ["힘센 삼손과 300용사 기드온", "왕이 없을 때 이스라엘을 이끈 사람들"]],
  ["룻기",    ["시어머니 나오미를 끝까지 따라간 며느리", "보아스의 밭에서 이삭을 주웠어요"]],
  ["사무엘상",["소년 다윗이 물맷돌로 골리앗을 이겼어요", "이스라엘의 첫 번째 왕 사울 (두 권 중 앞 권)"]],
  ["사무엘하",["다윗이 이스라엘의 왕이 되었어요", "다윗의 아들 압살롬 이야기 (두 권 중 뒤 권)"]],
  ["열왕기상",["지혜의 왕 솔로몬이 성전을 지었어요", "엘리야가 갈멜산에서 하늘의 불을 내렸어요 (앞 권)"]],
  ["열왕기하",["엘리야가 불수레를 타고 하늘로 올라갔어요", "엘리사의 기적들과 나라가 망한 이야기 (뒤 권)"]],
  ["역대상",  ["아담부터 시작하는 아주 긴 족보", "다윗 왕의 이야기를 다시 정리했어요 (앞 권)"]],
  ["역대하",  ["솔로몬부터 유다의 왕들 이야기", "성전이 무너지고 바벨론으로 끌려갔어요 (뒤 권)"]],
  ["에스라",  ["포로에서 돌아와 성전을 다시 지었어요", "율법을 가르친 학사(선생님)의 이름"]],
  ["느헤미야",["무너진 예루살렘 성벽을 52일 만에 다시 쌓았어요", "왕에게 술을 따르던 사람이 지도자가 됐어요"]],
  ["에스더",  ["왕비가 되어 자기 민족을 구한 용감한 여인", "사촌 오빠 모르드개와 나쁜 하만"]],
  ["욥기",    ["재산과 자녀를 모두 잃고도 하나님을 믿었어요", "고난을 이겨 낸 동방의 의인"]],
  ["시편",    ["\"여호와는 나의 목자시니\" 하나님께 드리는 노래", "150편이나 되는 성경에서 제일 긴 책"]],
  ["잠언",    ["\"개미에게 가서 배우라\" 지혜로운 짧은 말씀", "솔로몬의 지혜 모음, 31장에는 현숙한 여인"]],
  ["전도서",  ["\"헛되고 헛되다\" 해 아래 새것이 없어요", "모든 일에는 때가 있어요"]],
  ["아가",    ["솔로몬이 지은 아름다운 사랑의 노래", "노래 중의 노래, 구약 22권의 마지막 책"]]
];

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const chosung = s => [...s].map(ch => {
  const c = ch.charCodeAt(0) - 0xAC00;
  return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch;
}).join("");
const books = BOOKS.map(([name, hints], i) => ({ name, hints, no: i + 1, cho: chosung(name) }));
const twins = b => books.filter(x => x.cho === b.cho && x.name !== b.name);

const LEVELS = ["새싹 탐험가 🌱","꼬마 순례자 🎒","초성 사냥꾼 🔍","말씀 기사 🛡️","성경 박사 🎓","초성 마스터 👑"];

/* ---------- 저장 ---------- */
const KEY = "chosung-bible-v2";
let save = { xp: 0, best: 0, bestCombo: 0, plays: 0, wrong: [], sound: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

/* ---------- 상태 ---------- */
let deck = [], idx = 0, score = 0, combo = 0, maxCombo = 0, right = 0, hintsUsed = 0, retryMode = false, roundWrong = [];
const $ = id => document.getElementById(id);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const show = id => ["home","game","end"].forEach(s => $(s).classList.toggle("hidden", s !== id));

/* ---------- 소리 ---------- */
let ac;
function tone(freqs, dur = .12, type = "triangle") {
  if (!save.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + dur * 1.6);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur * 1.7);
    });
  } catch (e) {}
}
const sfx = {
  flip: () => tone([440, 660], .07),
  hint: () => tone([880], .1, "sine"),
  ok:   () => tone([523, 659, 784], .09),
  no:   () => tone([300, 220], .13, "sawtooth"),
  win:  () => tone([523, 659, 784, 1046], .14)
};
function renderSound() { $("soundBtn").textContent = save.sound ? "🔊 소리" : "🔇 소리"; }

/* ---------- 홈 ---------- */
function renderHome() {
  const lv = Math.floor(save.xp / 100) + 1, cur = save.xp % 100;
  $("lvNum").textContent = lv;
  $("lvName").textContent = LEVELS[Math.min(lv - 1, LEVELS.length - 1)];
  $("xpFill").style.width = cur + "%";
  $("xpText").textContent = cur + " / 100 XP · 다음 레벨까지 " + (100 - cur);
  $("bestScore").textContent = save.best;
  $("bestCombo").textContent = save.bestCombo;
  $("plays").textContent = save.plays;
  $("wrongCount").textContent = save.wrong.length;
  $("retryHomeBtn").disabled = !save.wrong.length;
  renderSound();
  show("home");
}

/* ---------- 게임 ---------- */
function startGame(retry) {
  retryMode = retry;
  const pool = retry ? books.filter(b => save.wrong.includes(b.name)) : books;
  if (!pool.length) return;
  deck = shuffle(pool); idx = 0; score = 0; combo = 0; maxCombo = 0; right = 0; roundWrong = [];
  $("modeTag").innerHTML = retry ? "🔁 틀린 카드 <b id='score'>0</b>점" : "⭐ <b id='score'>0</b>점";
  show("game"); renderCard();
}

function renderCard() {
  const b = deck[idx];
  hintsUsed = 0;
  $("card").classList.remove("on");
  $("bar").style.width = (idx / deck.length * 100) + "%";
  $("counter").textContent = (idx + 1) + " / " + deck.length;
  $("cardTag").textContent = retryMode ? "다시 도전 카드" : "초성 카드";
  $("initials").textContent = b.cho;
  $("hintBox").innerHTML = "";
  const t = twins(b);
  $("sameFront").classList.toggle("hidden", !t.length);
  $("sameFront").textContent = "👀 이 초성은 성경이 2권 있어요! 힌트로 구별해 봐";
  $("hintBtn").disabled = false;
  $("hintBtn").textContent = "💡 힌트 (" + b.hints.length + ")";
  $("frontControls").classList.remove("hidden");
  $("judgeControls").classList.add("hidden");
  // 정답면은 뒤집을 때 채운다 (미리 보이지 않게)
  $("answer").textContent = ""; $("order").textContent = "";
  $("sameBack").classList.add("hidden");
}

function showHint() {
  const b = deck[idx];
  if (hintsUsed >= b.hints.length) return;
  const d = document.createElement("div");
  d.className = "hint"; d.textContent = "💡 " + b.hints[hintsUsed];
  $("hintBox").appendChild(d);
  hintsUsed++;
  sfx.hint();
  const left = b.hints.length - hintsUsed;
  $("hintBtn").textContent = left ? "💡 힌트 (" + left + ")" : "💡 힌트 끝";
  $("hintBtn").disabled = !left;
}

function flipCard() {
  const b = deck[idx], t = twins(b);
  $("answer").textContent = b.name;
  $("order").textContent = "구약 " + b.no + "번째 책";
  if (t.length) {
    $("sameBack").textContent = "같은 초성 " + b.cho + " → " + [b.name, ...t.map(x => x.name)].join(", ");
    $("sameBack").classList.remove("hidden");
  }
  $("card").classList.add("on");
  $("frontControls").classList.add("hidden");
  $("judgeControls").classList.remove("hidden");
  sfx.flip();
}

function floater(text, miss) {
  const f = document.createElement("div");
  f.className = "floater" + (miss ? " miss" : ""); f.textContent = text;
  document.body.appendChild(f); setTimeout(() => f.remove(), 950);
}

function judge(ok) {
  const b = deck[idx];
  if (ok) {
    combo++; right++; maxCombo = Math.max(maxCombo, combo);
    const pts = [10, 6, 3][hintsUsed] + (combo >= 3 ? 2 : 0);
    score += pts;
    if (retryMode) save.wrong = save.wrong.filter(n => n !== b.name);
    floater("+" + pts);
    sfx.ok();
  } else {
    combo = 0;
    if (!roundWrong.includes(b.name)) roundWrong.push(b.name);
    if (!save.wrong.includes(b.name)) save.wrong.push(b.name);
    floater("다시 기억해! 💪", true);
    sfx.no();
  }
  $("score").textContent = score;
  const c = $("combo");
  c.textContent = combo >= 2 ? "🔥 " + combo + " 콤보!" : "";
  c.classList.remove("pop"); void c.offsetWidth; if (combo >= 2) c.classList.add("pop");
  persist();
  $("judgeControls").classList.add("hidden");
  setTimeout(() => { idx++; idx < deck.length ? renderCard() : finish(); }, 380);
}

/* ---------- 결과 ---------- */
function finish() {
  $("bar").style.width = "100%";
  const total = deck.length, rate = right / total;
  const stars = rate === 1 ? 3 : rate >= .7 ? 2 : rate >= .4 ? 1 : 0;
  let newRec = false;
  save.xp += score; save.plays++;
  if (!retryMode && score > save.best) { save.best = score; newRec = true; }
  if (maxCombo > save.bestCombo) { save.bestCombo = maxCombo; newRec = true; }
  persist();

  [...$("stars").children].forEach((s, i) => { s.className = i < stars ? "lit" : ""; s.style.animationDelay = (i * .2) + "s"; });
  $("endEmoji").textContent = stars === 3 ? "🏆" : stars === 2 ? "🎉" : stars === 1 ? "👍" : "💪";
  $("endTitle").textContent = stars === 3 ? "완벽해요!" : stars === 2 ? "아주 잘했어요!" : stars === 1 ? "좋아요, 조금만 더!" : "다시 해 보자!";
  $("endSub").textContent = retryMode ? "틀린 카드 다시 풀기 완료" : "22권 카드 도전 완료";
  $("newRec").classList.toggle("hidden", !newRec);
  $("rScore").textContent = score;
  $("rRight").textContent = right + "/" + total;
  $("rCombo").textContent = maxCombo;

  const wl = books.filter(b => roundWrong.includes(b.name));
  $("wrongBox").classList.toggle("hidden", !wl.length);
  $("wrongList").innerHTML = wl.map(b => "<span><small>" + b.cho + "</small>" + b.name + "</span>").join("");
  $("retryEndBtn").classList.toggle("hidden", !save.wrong.length);
  $("retryEndBtn").textContent = "🔁 틀린 카드 다시 풀기 (" + save.wrong.length + ")";

  show("end");
  if (stars >= 2) { sfx.win(); confetti(stars === 3 ? 90 : 40); }
}

function confetti(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#ffd54a","#3fd6a0","#ff6b6b","#4cc3ff","#ff7eb6","#b388ff"];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.8 + Math.random() * 1.8) + "s";
    p.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4500);
  }
}

/* ---------- 이벤트 ---------- */
$("startBtn").onclick = () => startGame(false);
$("againBtn").onclick = () => startGame(false);
$("retryHomeBtn").onclick = () => startGame(true);
$("retryEndBtn").onclick = () => startGame(true);
$("homeBtn").onclick = renderHome;
$("hintBtn").onclick = showHint;
$("flipBtn").onclick = flipCard;
$("okBtn").onclick = () => judge(true);
$("noBtn").onclick = () => judge(false);
$("soundBtn").onclick = () => { save.sound = !save.sound; persist(); renderSound(); };
$("quitBtn").onclick = () => $("quitModal").classList.remove("hidden");
$("stayBtn").onclick = () => $("quitModal").classList.add("hidden");
$("leaveBtn").onclick = () => { $("quitModal").classList.add("hidden"); renderHome(); };

renderHome();
</script>
</body>
</html>
