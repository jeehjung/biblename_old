<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b9e8ff"><title>구약 성경 초성 퀴즈</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#bdeaff,#fff2c9);font-family:system-ui,"Noto Sans KR",sans-serif;color:#29475b;min-height:100vh}.app{max-width:600px;margin:auto;padding:18px 15px 40px}.top{display:flex;justify-content:space-between}.pill{background:white;border:0;border-radius:20px;padding:9px 13px;color:#41657a;font-weight:800}.hero{text-align:center;padding:25px 8px 18px}.emoji{font-size:50px}h1{font-size:clamp(27px,7vw,38px);margin:8px 0;color:#245777}.hero p{font-weight:700;color:#59788b}.panel{background:#fffdf7;border:3px solid white;border-radius:25px;padding:19px;box-shadow:0 7px 0 #9bcde0}.primary,.secondary,.choice{font:inherit;border:0;cursor:pointer;font-weight:900;border-radius:16px;padding:15px}.primary{width:100%;margin-top:17px;background:linear-gradient(#ffdf83,#ffc94e);color:#654c20;font-size:19px;box-shadow:0 5px 0 #dfa83c}.secondary{width:100%;margin-top:10px;background:#eaf5fb;color:#376782}.hidden{display:none!important}.quizhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:900}.progress{height:11px;background:#e7f0f3;border-radius:20px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:#72c8a5;width:0}.question{background:#f0f9ff;border-radius:20px;padding:25px 12px;text-align:center;margin:10px 0 15px}.tag{font-size:13px;color:#6b9bb6;font-weight:900}.prompt{font-size:clamp(38px,12vw,58px);font-weight:1000;letter-spacing:7px;line-height:1.4;margin:15px 0}.answername{font-size:23px;font-weight:1000;color:#26754b;margin-top:12px}.hint{font-size:13px;color:#7591a3}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:66px;background:white;border:2px solid #dcebf2;color:#34546a;font-size:17px;box-shadow:0 3px 0 #d9e7ed}.choice:disabled{opacity:.55}.feedback{margin-top:14px;border-radius:16px;padding:14px;text-align:center;font-weight:900;background:#fff5d7}.good{background:#e4f8eb;color:#26754b}.bad{background:#fff0e9;color:#a84e37}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.stat{background:#f0f8ff;border-radius:16px;padding:13px}.stat b{display:block;font-size:23px;color:#327eaa}.review{background:#f7fafb;border-radius:16px;padding:13px;margin-top:15px;text-align:left}.note{text-align:center;font-size:12px;color:#8299a8;margin-top:14px}
</style></head><body><main class="app"><div class="top"><div class="pill">📖 말씀 탐험대</div><button class="pill" id="sound">🔊 소리 켜짐</button></div>
<section id="home"><header class="hero"><div class="emoji">☀️📚</div><h1>구약 성경 초성 퀴즈</h1><p>창세기부터 아가까지, 초성을 보고 맞혀 보자!</p></header><div class="panel"><div style="text-align:center;font-weight:900;font-size:18px">📚 구약 성경 앞부분 22권</div><p style="text-align:center;color:#718b9b">총 22문제가 무작위 순서로 나와요.</p><button class="primary" id="start">탐험 시작하기 🚀</button></div><p class="note">창세기부터 아가까지 · 초성 퀴즈 · 모르는 문제 다시 풀기</p></section>
<section id="game" class="hidden"><div class="quizhead"><button class="pill" id="quit">← 나가기</button><span id="counter"></span><span class="pill" id="score">⭐ 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="panel"><div class="question"><div class="tag">초성을 보고 성경 이름을 맞혀 봐!</div><div class="prompt" id="prompt"></div><div class="answername hidden" id="answername"></div><div class="hint" id="hint">정답을 알고 있으면 '알고 있어요'를 눌러 줘.</div></div><div class="answers"><button class="choice" id="know">😊 알고 있어요</button><button class="choice" id="dontknow">🤔 모르겠어요</button></div><div id="feedback" class="feedback hidden"></div><div id="autonext" class="hint hidden" style="text-align:center;margin-top:12px">3초 후 다음 문제로 넘어갑니다…</div></div></section>
<section id="end" class="hidden"><header class="hero"><div class="emoji">🏆</div><h1 id="endtitle">탐험 완료!</h1><p id="message">정말 잘했어!</p></header><div class="panel" style="text-align:center"><div id="stars" style="font-size:32px">⭐⭐⭐</div><div class="stats"><div class="stat">알고 있어요<b id="right"></b></div><div class="stat">모르겠어요<b id="rate"></b></div></div><div class="review hidden" id="review"><b>📝 다시 풀어볼 문제</b><div id="wronglist"></div></div><button class="primary hidden" id="retry">모르겠어요 문제만 다시 풀기 🔁</button><button class="secondary" id="homebtn">처음 화면으로</button></div></section></main>
<script>
const books=[["창세기","ㅊㅅㄱ"],["출애굽기","ㅊㅇㄱㄱ"],["레위기","ㄹㅇㄱ"],["민수기","ㅁㅅㄱ"],["신명기","ㅅㅁㄱ"],["여호수아","ㅇㅎㅅㅇ"],["사사기","ㅅㅅㄱ"],["룻기","ㄹㄱ"],["사무엘상","ㅅㅁㅇㅅ"],["사무엘하","ㅅㅁㅇㅎ"],["열왕기상","ㅇㅇㄱㅅ"],["열왕기하","ㅇㅇㄱㅎ"],["역대상","ㅇㄷㅅ"],["역대하","ㅇㄷㅎ"],["에스라","ㅇㅅㄹ"],["느헤미야","ㄴㅎㅁㅇ"],["에스더","ㅇㅅㄷ"],["욥기","ㅇㄱ"],["시편","ㅅㅍ"],["잠언","ㅈㅇ"],["전도서","ㅈㄷㅅ"],["아가","ㅇㄱ"]];
let questions=[],idx=0,known=0,unknown=[],sound=true,reviewMode=false,reviewRemaining=[],advanceTimer=null;
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function start(){clearTimeout(advanceTimer);questions=shuffle([...books]);idx=0;known=0;unknown=[];reviewMode=false;$("home").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");render();}
function render(){let q=questions[idx];$("counter").textContent=(idx+1)+" / "+questions.length;$("score").textContent=reviewMode?"🔁 다시 풀기":"⭐ "+known;$("bar").style.width=(idx/questions.length*100)+"%";$("prompt").textContent=q[1];$("answername").classList.add("hidden");$("answername").textContent="";$("hint").textContent="정답을 알고 있으면 '알고 있어요'를 눌러 줘."; $("feedback").className="feedback hidden";$("autonext").classList.add("hidden");$("know").disabled=false;$("dontknow").disabled=false;}
function reveal(isKnown){let q=questions[idx];$("answername").textContent=q[0];$("answername").classList.remove("hidden");$("know").disabled=true;$("dontknow").disabled=true;if(isKnown){if(reviewMode)reviewRemaining=reviewRemaining.filter(x=>x[0]!==q[0]);else known++;$("feedback").textContent="좋아! 정답은 "+q[0]+" 이야!";$("feedback").className="feedback good";if(sound)beep(660);}else{if(reviewMode){reviewRemaining=reviewRemaining.filter(x=>x[0]!==q[0]);reviewRemaining.push(q);}else if(!unknown.some(x=>x[0]===q[0]))unknown.push(q);$("feedback").textContent="괜찮아! 정답은 "+q[0]+" 이야. 기억해 보자!";$("feedback").className="feedback bad";if(sound)beep(220);} $("autonext").classList.remove("hidden");let seconds=3;$("autonext").textContent=seconds+"초 후 다음 문제로 넘어갑니다…";let tick=setInterval(()=>{seconds--;if(seconds>0)$("autonext").textContent=seconds+"초 후 다음 문제로 넘어갑니다…";else clearInterval(tick);},1000);advanceTimer=setTimeout(()=>{clearInterval(tick);advance();},3000);}
function advance(){clearTimeout(advanceTimer);idx++;if(idx<questions.length)render();else reviewMode?finishReview():finish();}
function showEnd(title,knownText,unknownText,items){$("game").classList.add("hidden");$("end").classList.remove("hidden");$("endtitle").textContent=title;$("right").textContent=knownText;$("rate").textContent=unknownText;$("review").classList.toggle("hidden",!items.length);$("wronglist").textContent=items.map(x=>x[1]+" → "+x[0]).join(" · ");$("retry").classList.toggle("hidden",!items.length);}
function finish(){showEnd("탐험 완료!",known+"문제",unknown.length+"문제",unknown);$("message").textContent=unknown.length?"모르겠어요 문제만 다시 풀어 보자!":"모든 문제를 알고 있어요! 대단해!";$("stars").textContent=unknown.length?"⭐⭐":"⭐⭐⭐";}
function startReview(){if(!unknown.length)return;clearTimeout(advanceTimer);reviewMode=true;reviewRemaining=[...unknown];questions=shuffle([...unknown]);idx=0;$("end").classList.add("hidden");$("game").classList.remove("hidden");render();}
function finishReview(){unknown=[...reviewRemaining];showEnd("다시 풀기 완료!",unknown.length?"다시 연습할 문제":"모두 익혔어요!",unknown.length+"문제 남음",unknown);$("message").textContent=unknown.length?"남은 문제를 한 번 더 풀어 보자!":"모르겠어요 문제를 모두 맞혔어! 멋져!";$("stars").textContent=unknown.length?"⭐":"⭐⭐⭐";}
function beep(f){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
$("start").onclick=start;$("know").onclick=()=>reveal(true);$("dontknow").onclick=()=>reveal(false);$("retry").onclick=startReview;$("homebtn").onclick=()=>{$("end").classList.add("hidden");$("home").classList.remove("hidden");};$("quit").onclick=()=>{if(confirm("퀴즈를 그만하고 처음으로 돌아갈까요?")){clearTimeout(advanceTimer);$("game").classList.add("hidden");$("home").classList.remove("hidden");}};$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 소리 켜짐":"🔇 소리 꺼짐";};
</script></body></html>
