<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b9e8ff"><title>구약 성경 이름 퀴즈</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#bdeaff,#fff2c9);font-family:system-ui,"Noto Sans KR",sans-serif;color:#29475b;min-height:100vh}.app{max-width:620px;margin:auto;padding:18px 15px 40px}.top{display:flex;justify-content:space-between;font-weight:900}.pill{background:#fff;border-radius:20px;padding:9px 13px;border:0;color:#41657a;font-weight:800}.hero{text-align:center;padding:25px 8px 18px}.emoji{font-size:50px}h1{font-size:clamp(27px,7vw,38px);margin:8px 0;color:#245777}.hero p{font-weight:700;color:#59788b}.panel{background:#fffdf7;border:3px solid white;border-radius:25px;padding:19px;box-shadow:0 7px 0 #9bcde0}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.mode,.choice,.primary,.secondary{font:inherit;border:0;cursor:pointer;font-weight:900;border-radius:16px;padding:14px}.mode{background:#f0f8ff;border:2px solid #d6edfa;text-align:left;color:#34556b}.mode.active{background:#fff0b9;border-color:#f0c64e}.mode span{display:block;font-size:23px}.mode small{display:block;color:#718b9b;margin-top:4px;font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.row label{background:#fff;border-radius:18px;padding:9px 12px;font-weight:800}.primary{width:100%;margin-top:17px;background:linear-gradient(#ffdf83,#ffc94e);color:#654c20;font-size:19px;box-shadow:0 5px 0 #dfa83c}.secondary{width:100%;margin-top:10px;background:#eaf5fb;color:#376782}.hidden{display:none!important}.quizhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:900}.progress{height:11px;background:#e7f0f3;border-radius:20px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:#72c8a5;width:0}.question{background:#f0f9ff;border-radius:20px;padding:22px 12px;text-align:center;margin:10px 0 15px}.tag{font-size:12px;color:#6b9bb6;font-weight:900}.prompt{font-size:22px;font-weight:1000;line-height:1.5;margin:10px 0}.hint{font-size:13px;color:#7591a3}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:62px;background:white;border:2px solid #e1edf3;color:#34546a;font-size:16px;box-shadow:0 3px 0 #d9e7ed}.choice.correct{background:#e2f8eb;border-color:#77c99b;color:#26754b}.choice.wrong{background:#fff0eb;border-color:#ffab91;color:#a84e37}.choice:disabled{cursor:default}.feedback{margin-top:14px;border-radius:16px;padding:13px;text-align:center;font-weight:900;background:#fff5d7}.good{background:#e4f8eb;color:#26754b}.bad{background:#fff0e9;color:#a84e37}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.stat{background:#f0f8ff;border-radius:16px;padding:13px}.stat b{display:block;font-size:23px;color:#327eaa}.review{text-align:left;background:#f7fafb;border-radius:16px;padding:13px;margin-top:15px}.note{text-align:center;font-size:12px;color:#8299a8;margin-top:14px}@media(max-width:380px){.panel{padding:14px}.choice{font-size:14px}.prompt{font-size:19px}}
</style></head><body><main class="app">
<div class="top"><div class="pill">📖 말씀 탐험대</div><div class="pill" id="sound">🔊 소리 켜짐</div></div>
<section id="home"><header class="hero"><div class="emoji">☀️📚</div><h1>구약 성경 이름 퀴즈</h1><p>39권의 이름을 재미있게 맞혀 보자!</p></header><div class="panel"><b>🎮 퀴즈 방법을 골라 봐!</b><div class="modes">
<button class="mode active" data-mode="clue"><span>🔍</span>설명 보고 맞히기<small>설명을 읽고 책 이름 찾기</small></button>
<button class="mode" data-mode="next"><span>➡️</span>다음 책 맞히기<small>성경 순서 알아보기</small></button>
<button class="mode" data-mode="number"><span>🔢</span>순서 보고 맞히기<small>몇 번째 책일까?</small></button>
<button class="mode" data-mode="category"><span>🧺</span>종류 보고 맞히기<small>어느 묶음에 속할까?</small></button></div>
<div class="row"><label><input type="radio" name="count" value="10" checked> 10문제</label><label><input type="radio" name="count" value="20"> 20문제</label><label><input type="radio" name="count" value="39"> 39문제</label></div>
<button class="primary" id="start">탐험 시작하기 🚀</button></div><p class="note">구약 성경 39권 · 무작위 출제 · 오답 복습</p></section>
<section id="game" class="hidden"><div class="quizhead"><button class="pill" id="quit">← 나가기</button><span id="counter">1 / 10</span><span class="pill" id="score">⭐ 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="panel"><div class="question"><div class="tag" id="tag"></div><div class="prompt" id="prompt"></div><div class="hint" id="hint"></div></div><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden"></div><button class="primary hidden" id="next">다음 문제 ➜</button></div></section>
<section id="end" class="hidden"><header class="hero"><div class="emoji">🏆</div><h1>탐험 완료!</h1><p>정말 멋지게 도전했어!</p></header><div class="panel" style="text-align:center"><div id="stars" style="font-size:32px">⭐⭐⭐</div><h1 id="finalscore">0점</h1><h2 id="message">잘했어!</h2><div class="stats"><div class="stat">맞힌 문제<b id="right"></b></div><div class="stat">정답률<b id="rate"></b></div></div><div class="review hidden" id="review"><b>📝 다시 알아볼 문제</b><div id="wronglist"></div></div><button class="primary" id="retry">한 번 더 도전하기 🔁</button><button class="secondary" id="homebtn">처음 화면으로</button></div></section></main>
<script>
const books=[
["창세기","세상의 시작과 하나님이 만드신 세상, 아브라함과 요셉의 이야기가 나와요.","모세오경"],["출애굽기","모세가 이스라엘 백성을 이끌고 이집트에서 나오는 이야기예요.","모세오경"],["레위기","하나님께 예배드리는 방법과 제사장에 관한 규례가 나와요.","모세오경"],["민수기","이스라엘 백성이 광야에서 지낸 시간과 인구 조사가 나와요.","모세오경"],["신명기","모세가 약속의 땅에 들어가기 전 하나님의 말씀을 다시 전해요.","모세오경"],
["여호수아","여호수아가 이스라엘 백성을 이끌고 가나안 땅에 들어가요.","역사서"],["사사기","하나님이 세우신 사사들이 이스라엘을 구하는 이야기예요.","역사서"],["룻기","룻이 시어머니 나오미를 사랑으로 섬기는 이야기예요.","역사서"],["사무엘상","사무엘과 사울, 다윗 왕의 이야기가 시작돼요.","역사서"],["사무엘하","다윗 왕이 이스라엘을 다스린 이야기가 나와요.","역사서"],["열왕기상","솔로몬 왕과 이스라엘 왕국이 나뉘는 이야기가 나와요.","역사서"],["열왕기하","이스라엘과 유다 여러 왕, 엘리야와 엘리사의 이야기가 나와요.","역사서"],["역대상","아담부터 이어지는 족보와 다윗 왕의 이야기를 기록해요.","역사서"],["역대하","솔로몬부터 유다 왕국의 역사와 성전 이야기가 나와요.","역사서"],["에스라","포로 생활을 마친 백성이 예루살렘으로 돌아와 성전을 다시 세워요.","역사서"],["느헤미야","느헤미야가 예루살렘 성벽을 다시 쌓는 이야기예요.","역사서"],["에스더","에스더 왕비가 자기 민족을 위기에서 구하는 이야기예요.","역사서"],
["욥기","고난을 겪는 욥과 하나님에 관한 깊은 이야기가 나와요.","시가서"],["시편","하나님을 찬양하고 기도하는 노래와 시가 모여 있어요.","시가서"],["잠언","하나님을 경외하는 지혜로운 삶에 관한 교훈이 담겨 있어요.","시가서"],["전도서","세상의 여러 일이 헛됨을 말하며 하나님을 경외하라고 가르쳐요.","시가서"],["아가","사랑의 아름다움을 노래하는 시예요.","시가서"],
["이사야","하나님의 심판과 구원, 오실 메시아에 관한 예언이 나와요.","대선지서"],["예레미야","예루살렘의 죄를 꾸짖고 회개를 전한 예언자의 말씀이에요.","대선지서"],["예레미야애가","무너진 예루살렘을 슬퍼하며 부르는 노래예요.","대선지서"],["에스겔","포로로 잡혀간 백성에게 하나님의 심판과 회복을 전해요.","대선지서"],["다니엘","다니엘의 믿음과 사자 굴 이야기, 여러 환상이 나와요.","대선지서"],
["호세아","호세아의 가정을 통해 하나님의 변함없는 사랑을 보여 줘요.","소선지서"],["요엘","메뚜기 재앙과 여호와의 날, 성령을 부어 주실 약속을 전해요.","소선지서"],["아모스","정의를 행하지 않는 백성에게 하나님의 심판을 전해요.","소선지서"],["오바댜","에돔의 교만과 심판에 관한 짧은 예언서예요.","소선지서"],["요나","요나가 큰 물고기 뱃속에 들어갔다가 니느웨로 가는 이야기예요.","소선지서"],["미가","정의를 행하고 인자를 사랑하며 겸손히 하나님과 함께하라고 전해요.","소선지서"],["나훔","니느웨가 심판받을 것이라는 예언을 전해요.","소선지서"],["하박국","하박국이 하나님께 질문하고 믿음으로 살 것을 배워요.","소선지서"],["스바냐","여호와의 날과 심판, 남은 백성의 회복을 전해요.","소선지서"],["학개","돌아온 백성에게 성전을 다시 세우라고 격려해요.","소선지서"],["스가랴","성전 재건과 하나님이 보내실 왕에 관한 환상을 전해요.","소선지서"],["말라기","하나님께 드리는 예배와 십일조, 주님의 오심을 전해요.","소선지서"]];
const groups=["모세오경","역사서","시가서","대선지서","소선지서"];let mode="clue",questions=[],idx=0,score=0,wrong=[],answered=false,sound=true,lastCount=10;const $=id=>document.getElementById(id);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode});
function makeQuestion(i){let [name,desc,group]=books[i],prompt,tag,hint,correct=name,pool=books.map(x=>x[0]);if(mode==="clue"){prompt=desc;tag="설명을 읽고 성경 이름을 맞혀 봐!";hint="39권 중 알맞은 책 이름을 골라 봐."}if(mode==="next"){prompt=(i===0?"성경의 첫 번째 책은 무엇일까요?":books[i-1][0]+" 다음에 나오는 성경은 무엇일까요?");tag="성경 순서 퀴즈";hint="구약 성경의 순서를 떠올려 봐."}if(mode==="number"){prompt="구약 성경 "+(i+1)+"번째 책은 무엇일까요?";tag="몇 번째 책일까?";hint="성경 목차의 순서를 생각해 봐."}if(mode==="category"){prompt="'"+name+"'은(는) 어떤 종류의 책에 속할까요?";tag="성경의 다섯 묶음";hint="구약 성경은 다섯 영역으로 나누어 배울 수 있어.";correct=group;pool=groups}let opts=shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,3)]);return{prompt,tag,hint,correct,opts}}
function start(){lastCount=Number(document.querySelector('input[name=count]:checked').value);questions=shuffle(Array.from({length:39},(_,i)=>i)).slice(0,lastCount).map(makeQuestion);idx=0;score=0;wrong=[];$("home").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");render()}
function render(){answered=false;let q=questions[idx];$("counter").textContent=(idx+1)+" / "+questions.length;$("score").textContent="⭐ "+score;$("bar").style.width=idx/questions.length*100+"%";$("tag").textContent=q.tag;$("prompt").textContent=q.prompt;$("hint").textContent=q.hint;$("feedback").className="feedback hidden";$("next").classList.add("hidden");$("answers").innerHTML="";q.opts.forEach((o,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=["A","B","C","D"][i]+". "+o;b.onclick=()=>choose(o,b);$("answers").appendChild(b)})}
function choose(value,btn){if(answered)return;answered=true;let q=questions[idx],ok=value===q.correct;document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===q.correct)b.classList.add("correct")});if(ok){score+=10;$("feedback").textContent="정답이야! 참 잘했어! ⭐ +10점";$("feedback").className="feedback good";if(sound)beep(660)}else{btn.classList.add("wrong");wrong.push(q);$("feedback").textContent="아쉬워! 정답은 '"+q.correct+"'이야. 다시 기억해 보자!";$("feedback").className="feedback bad";if(sound)beep(220)}$("score").textContent="⭐ "+score;$("next").textContent=idx===questions.length-1?"결과 보기 🏆":"다음 문제 ➜";$("next").classList.remove("hidden")}
function next(){idx++;if(idx<questions.length)render();else finish()}function finish(){$("game").classList.add("hidden");$("end").classList.remove("hidden");let rate=Math.round((questions.length-wrong.length)/questions.length*100);$("finalscore").textContent=score+"점";$("right").textContent=(questions.length-wrong.length)+" / "+questions.length;$("rate").textContent=rate+"%";$("stars").textContent=rate>=90?"⭐⭐⭐":rate>=60?"⭐⭐":"⭐";$("message").textContent=rate===100?"완벽해! 구약 성경 박사야!":rate>=80?"정말 잘했어! 조금만 더!":rate>=50?"멋진 도전이야! 다시 해 보자!":"괜찮아! 연습하면 더 잘할 수 있어!";if(wrong.length){$("review").classList.remove("hidden");$("wronglist").innerHTML=wrong.map(q=>"<p>• "+q.prompt+"<br><b>정답: "+q.correct+"</b></p>").join("")}else $("review").classList.add("hidden")}
function beep(f){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
$("start").onclick=start;$("next").onclick=next;$("quit").onclick=()=>{if(confirm("퀴즈를 그만하고 처음으로 돌아갈까요?")){$("game").classList.add("hidden");$("home").classList.remove("hidden")}};$("retry").onclick=start;$("homebtn").onclick=()=>{$("end").classList.add("hidden");$("home").classList.remove("hidden")};$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 소리 켜짐":"🔇 소리 꺼짐"};
</script></body></html>
